# Uptime-мониторинг HiraLearn.
# Каждые 5 минут проверяет, что сайт (Netlify) и бэкенд (Supabase) живы.
# При падении workflow run падает с ошибкой — GitHub пришлёт уведомление
# (включите Email-уведомления о failed workflow runs в настройках GitHub).
#
# Ручной запуск: Actions → Uptime Monitor → Run workflow.
name: Uptime Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # каждые 5 минут
  workflow_dispatch:         # ручной запуск

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site (Netlify)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://hiraoka.netlify.app/)
          echo "Site HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Site is DOWN (HTTP $code)"
            exit 1
          fi

      - name: Check Supabase backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://pckydjhjvunvgekppqqd.supabase.co/auth/v1/health)
          echo "Supabase HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase is DOWN or PAUSED (HTTP $code). Restore at supabase.com/dashboard"
            exit 1
          fi
